name: Backtest SAR 1x Only

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Esegui backtest
        run: python backtest_sar_1x.py

      - name: Commit report
        run: |
          git config user.name  "RAPTOR Bot"
          git config user.email "raptor-bot@noreply.github.com"
          git add backtest_sar_1x.json backtest_sar_1x.txt
          git diff --staged --quiet || git commit -m "📊 Backtest SAR 1x only $(date +'%d/%m/%Y %H:%M')"
          git pull --rebase origin main
          git push
          
